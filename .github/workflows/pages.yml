name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "ue/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the existing README-based site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ue/package-lock.json

      - name: Install UE app dependencies
        run: npm ci
        working-directory: ue

      - name: Build UE app
        run: npm run build
        working-directory: ue

      - name: Assemble the Pages site
        run: |
          mkdir -p ./public
          cp -R ./_site/. ./public/
          rm -rf ./public/ue
          mkdir -p ./public/ue
          cp -R ./ue/dist/. ./public/ue/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
