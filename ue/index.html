<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>UE 喇叭控制 (純 HTML 版)</title>

</head>

<body>



    <h1>UE / Logitech 藍牙喇叭控制器</h1>

    <hr>



    <!-- 操作區：使用純超連結觸發 JS -->

    <p>

        [ <a href="javascript:void(0)" onclick="connectBle()">1. 搜尋並連線喇叭</a> ]

        &nbsp;&nbsp;

        [ <a href="javascript:void(0)" onclick="sendPowerOn()">2. 發送開機指令</a> ]

    </p>



    <p>

        目前設定的發射端 MAC: <b id="macDisplay">讀取中...</b><br>

        預設發送 Hex Payload: <code id="payloadDisplay"></code>

    </p>

    <small>提示：可在網址列加上參數修改，例如：<code>http://localhost:8080/?mac=00E04C239987</code></small>



    <hr>

    <h3>執行紀錄 (Log)</h3>

    <pre id="log" style="border: 1px solid black; padding: 10px; height: 200px; overflow: auto;"></pre>



    <script>

        // 1. 固定 UUID 定義

        const SERVICE_UUID = "000061fe-0000-1000-8000-00805f9b34fb";

        const CHAR_UUID    = "c6d6dc0d-07f5-47ef-9b59-630622b01fd3";



        // 2. 預設 MAC (截圖中的 RTL8761B: 00:E0:4C:23:99:87)

        const DEFAULT_MAC = "00E04C239988";



        let gattServer = null;

        let powerChar = null;



        // 螢幕輸出 log 輔助函式

        function log(msg) {

            const el = document.getElementById("log");

            el.textContent += msg + "\n";

            el.scrollTop = el.scrollHeight;

            console.log(msg);

        }



        // 3. 解析網址列 Query String (?mac=...)

        function getTargetMac() {

            const params = new URLSearchParams(window.location.search);

            let mac = params.get("mac");

            if (!mac) {

                return DEFAULT_MAC;

            }

            // 清理字串：移除冒號、橫槓與空格，轉成純大寫 Hex

            return mac.replace(/[:\-\s]/g, "").toUpperCase();

        }



        // 4. 將 Hex 字串轉換為 Uint8Array (位元組陣列) 並加上結尾 0x01

        function buildPayload(macHex) {

            // 每 2 個 hex 字元轉成 1 個 byte (共 6 bytes)

            const macBytes = [];

            for (let i = 0; i < macHex.length; i += 2) {

                macBytes.push(parseInt(macHex.substr(i, 2), 16));

            }

            // 加上 0x01 (開機碼)

            macBytes.push(0x01);

            return new Uint8Array(macBytes);

        }



        // 頁面載入時先在畫面上顯示目前的 MAC 與 Hex

        const targetMac = getTargetMac();

        const payloadData = buildPayload(targetMac);

        document.getElementById("macDisplay").textContent = targetMac;

        document.getElementById("payloadDisplay").textContent =

            Array.from(payloadData).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(" ");



        // 5. 搜尋並建立 GATT 連線

        async function connectBle() {

            try {

                log("發起掃描 Logitech 設備...");

                const device = await navigator.bluetooth.requestDevice({

                    acceptAllDevices: true,

                    optionalServices: [SERVICE_UUID, 0x61FE]

                });



                log("已選擇: " + (device.name || "未命名"));



                log("建立 GATT 連線中...");

                gattServer = await device.gatt.connect();

                log("✓ GATT 連線成功");



                log("尋找 Service (61FE)...");

                const service = await gattServer.getPrimaryService(SERVICE_UUID);



                log("尋找開關機特徵值 (C6D6DC0D...)...");

                powerChar = await service.getCharacteristic(CHAR_UUID);



                log("✓ 特徵值鎖定成功，現在可以點擊 [2. 發送開機指令]");



            } catch (err) {

                log("連線出錯: " + err.message);

            }

        }



        // 6. 寫入 7-byte 開機 Payload

        async function sendPowerOn() {

            if (!powerChar) {

                log("錯誤: 特徵值未就緒，請先點擊第 1 步連線");

                return;

            }



            try {

                const hexStr = Array.from(payloadData).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(" ");

                log("正在寫入 Payload: " + hexStr + " ...");



                // 根據特徵值屬性選擇 Write 方式

                if (powerChar.properties.write) {

                    await powerChar.writeValueWithResponse(payloadData);

                } else {

                    await powerChar.writeValueWithoutResponse(payloadData);

                }



                log("✓ 寫入成功！請聽喇叭是否有發出開機音效。");



            } catch (err) {

                log("寫入失敗: " + err.message);

            }

        }

    </script>



</body>

</html>
