<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UE Speaker Controller</title>
  </head>
  <body>
    <h1>UE / Logitech Bluetooth Speaker Controller</h1>
    <hr />
    <p>
      <button id="btnConnectAndWake" type="button">Choose Speaker and Wake</button>
    </p>
    <p>
      Configured Transmitter MAC: <b id="macDisplay">Loading...</b><br />
      Default Hex Payload: <code id="payloadDisplay"></code>
    </p>
    <small>
      Tip: Add a parameter to the URL to change the MAC address, for example:
      <code>https://lihgong.github.io/ue/?mac=00E04C239987</code>
    </small>
    <hr />
    <h2>Execution Log</h2>
    <pre id="log" style="border: 1px solid black; padding: 10px; height: 200px; overflow: auto"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
